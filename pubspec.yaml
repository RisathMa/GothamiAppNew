name: gothami_junior_school
description: A responsive mobile application for Gothami Junior School

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI components
  cupertino_icons: ^1.0.8

  # Supabase for backend
  supabase_flutter: ^2.8.0

  # UI enhancements
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # HTTP requests
  http: ^1.2.2
  onesignal_flutter: ^5.3.4
  
  # Feature dependencies
  url_launcher: ^6.3.0
  dio: ^5.5.0+1
  gal: ^2.3.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App Icon Configuration (No change needed here)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#A52A2A"

flutter:
  uses-material-design: true

  # Assets (No change needed here)
  assets:
    - assets/icon/